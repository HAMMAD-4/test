<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Secure Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* animated BG blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    animation: drift 12s ease-in-out infinite alternate;
  }
  body::before { width: 500px; height: 500px; background: #6c63ff; top: -100px; left: -100px; }
  body::after  { width: 400px; height: 400px; background: #00d4ff; bottom: -80px; right: -80px;
                 animation-delay: -6s; }
  @keyframes drift { to { transform: translate(40px, 40px) scale(1.05); } }

  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 20px;
    padding: 48px 40px 40px;
    width: 380px;
    box-shadow: 0 30px 60px rgba(0,0,0,.4);
    animation: slideUp .6s ease;
  }
  @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }

  .logo { text-align: center; margin-bottom: 28px; }
  .logo .icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #6c63ff, #00d4ff);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 26px; margin-bottom: 14px;
    box-shadow: 0 8px 20px rgba(108,99,255,.4);
  }
  h2 { color: #fff; font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
  .sub { color: rgba(255,255,255,.55); font-size: .875rem; }

  .alert {
    background: rgba(255,80,80,.15); border: 1px solid rgba(255,80,80,.35);
    border-radius: 10px; padding: 10px 14px;
    color: #ff8080; font-size: .84rem; margin: 16px 0 0;
  }
  .field { margin-top: 22px; }
  label { display: block; color: rgba(255,255,255,.7); font-size: .8rem; font-weight: 500;
          text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; }
  input {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px; color: #fff; font-size: .95rem;
    transition: border-color .25s, background .25s;
    outline: none;
  }
  input::placeholder { color: rgba(255,255,255,.35); }
  input:focus { border-color: #6c63ff; background: rgba(108,99,255,.12); }
  .btn {
    margin-top: 28px; width: 100%; padding: 13px;
    background: linear-gradient(135deg, #6c63ff, #00d4ff);
    color: #fff; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity .2s, transform .15s;
    letter-spacing: .03em;
  }
  .btn:hover { opacity: .88; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🛡️</div>
    <h2>Admin Portal</h2>
    <p class="sub">Sign in to your secure dashboard</p>
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}
        <div class="alert">⚠️ {{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn">Sign In →</button>
  </form>
</div>
</body>
</html>
